<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#050a07"/><stop offset="1" stop-color="#102313"/></linearGradient><radialGradient id="g"><stop stop-color="#d4fe6a" stop-opacity=".18"/><stop offset="1" stop-color="#d4fe6a" stop-opacity="0"/></radialGradient></defs><rect width="1440" height="1080" rx="34" fill="url(#b)"/><circle cx="1270" cy="90" r="340" fill="url(#g)"/><rect x="44" y="44" width="1352" height="992" rx="30" fill="none" stroke="#26372b"/><rect x="72" y="70" width="82" height="82" rx="22" fill="#d4fe6a"/><path d="M93 94h40v36H93zm7 8h26m-26 9h26m-26 9h26" stroke="#102015" stroke-width="5" fill="none"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="180" y="116" font-size="54" font-weight="800" fill="#f5f7f2">SheetPilot</text><text x="444" y="116" font-size="54" font-weight="800" fill="#d4fe6a">AI</text><text x="180" y="152" font-size="22" fill="#9aa89d">Объединение листов и Excel-файлов в один поток</text><rect x="1150" y="70" width="202" height="46" rx="23" fill="#102016" stroke="#4a6a33"/><circle cx="1176" cy="93" r="7" fill="#d4fe6a"/><text x="1198" y="101" font-size="18" font-weight="700" fill="#f5f7f2">Несколько файлов</text><rect x="72" y="214" width="360" height="704" rx="26" fill="#0d1711" stroke="#26352a"/><text x="104" y="270" font-size="30" font-weight="800" fill="#f5f7f2">Один файл вместо ручной сборки</text><text x="104" y="342" font-size="22" font-weight="700" fill="#d4fe6a">01  Несколько источников</text><text x="104" y="374" font-size="17" fill="#9aa89d">Листы и файлы собираются вместе</text><text x="104" y="467" font-size="22" font-weight="700" fill="#d4fe6a">02  Сопоставление</text><text x="104" y="499" font-size="17" fill="#9aa89d">Столбцы приводятся к одной структуре</text><text x="104" y="592" font-size="22" font-weight="700" fill="#d4fe6a">03  Итоговый XLSX</text><text x="104" y="624" font-size="17" fill="#9aa89d">Экспорт после проверки результата</text><rect x="104" y="760" width="296" height="120" rx="20" fill="#102016" stroke="#35502c"/><text x="128" y="804" font-size="19" font-weight="700" fill="#d4fe6a">3 источника → 1 результат</text><text x="128" y="838" font-size="16" fill="#9aa89d">Без ручного копирования строк</text><rect x="466" y="202" width="896" height="716" rx="28" fill="#09110d" stroke="#38532e"/><text x="500" y="250" font-size="22" font-weight="800" fill="#f5f7f2">SheetPilot <tspan fill="#d4fe6a">AI</tspan></text><text x="1185" y="250" font-size="14" fill="#9aa89d">Файлы   История   Настройки</text><rect x="500" y="284" width="828" height="190" rx="20" fill="#101d15" stroke="#26352a"/><text x="526" y="322" font-size="17" font-weight="700" fill="#f5f7f2">1  Объедините Excel-файлы</text><rect x="526" y="344" width="245" height="74" rx="14" fill="#0a120e" stroke="#35502c"/><text x="548" y="373" font-size="15" fill="#dfe7df">Склад_1.xlsx</text><text x="548" y="397" font-size="13" fill="#9aa89d">12 КБ · 1 лист</text><rect x="780" y="344" width="245" height="74" rx="14" fill="#0a120e" stroke="#35502c"/><text x="802" y="373" font-size="15" fill="#dfe7df">Склад_2.xlsx</text><text x="802" y="397" font-size="13" fill="#9aa89d">18 КБ · 2 листа</text><rect x="1034" y="344" width="245" height="74" rx="14" fill="#0a120e" stroke="#35502c"/><text x="1056" y="373" font-size="15" fill="#dfe7df">Склад_3.xlsx</text><text x="1056" y="397" font-size="13" fill="#9aa89d">15 КБ · 1 лист</text><rect x="1035" y="428" width="267" height="34" rx="17" fill="#d4fe6a"/><text x="1168" y="451" font-size="15" font-weight="800" fill="#071008" text-anchor="middle">Объединить данные</text><text x="500" y="518" font-size="17" font-weight="700" fill="#f5f7f2">2  Результат объединения</text><rect x="500" y="544" width="250" height="258" rx="18" fill="#0d1511" stroke="#26352a"/><text x="520" y="578" font-size="15" font-weight="800" fill="#f5f7f2">Склад_1</text><text x="520" y="620" font-size="12" fill="#cbd5cc">Ноутбук · 10 · 55 000</text><text x="520" y="654" font-size="12" fill="#cbd5cc">Мышь · 25 · 1 200</text><rect x="770" y="544" width="250" height="258" rx="18" fill="#0d1511" stroke="#26352a"/><text x="790" y="578" font-size="15" font-weight="800" fill="#f5f7f2">Склад_2</text><text x="790" y="620" font-size="12" fill="#cbd5cc">Клавиатура · 14 · 2 500</text><text x="790" y="654" font-size="12" fill="#cbd5cc">Монитор · 8 · 15 000</text><rect x="1040" y="544" width="288" height="258" rx="18" fill="#112017" stroke="#4a6a33"/><text x="1060" y="578" font-size="15" font-weight="800" fill="#d4fe6a">Итоговый файл</text><rect x="1060" y="600" width="248" height="40" fill="#e4f8bc"/><text x="1184" y="626" font-size="11" fill="#203018" text-anchor="middle">Товар · Склад · Остаток · Сумма</text><text x="1060" y="672" font-size="12" fill="#f5f7f2">Ноутбук · Склад 1 · 10 · 550 000</text><text x="1060" y="706" font-size="12" fill="#f5f7f2">Мышь · Склад 1 · 25 · 30 000</text><text x="1060" y="740" font-size="12" fill="#f5f7f2">Монитор · Склад 2 · 8 · 120 000</text><path d="M735 676h30m240 0h30" stroke="#d4fe6a" stroke-width="4"/><rect x="500" y="824" width="828" height="66" rx="16" fill="#112017" stroke="#3d5b31"/><text x="526" y="864" font-size="14" font-weight="650" fill="#f5f7f2">● 3 файла объединены     ● 28 строк сопоставлено     ● 5 столбцов выровнено</text><text x="72" y="984" font-size="15" fill="#cbd5cc">FastAPI   ·   Excel automation   ·   Structured JSON   ·   Экспорт XLSX</text><text x="1330" y="984" font-size="16" font-weight="700" fill="#d4fe6a" text-anchor="end">Один результат вместо ручной сборки</text></g></svg>